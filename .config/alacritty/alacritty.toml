[colors.normal]
black = "#000000"   # bl: dark background (almost black)
red = "#F30004"     # ia: red (errors)
green = "#178529"   # va: forest green (success)
yellow = "#F7FB09"  # ca: yellow (warnings)
# blue = "#0000FF"    # va: light blue-green (information)
blue = "#0041C2"    # va: light blue-green (information)
magenta = "#FF00FF" # ca: blue lavender (highlight)
cyan = "#00FFFF"    # va: light blue-green (links)
white = "#C9C7CD"   # na: main text (light gray)

[colors.primary]
background = "#000000" # bl: dark background (almost black)
foreground = "#C9C7CD" # na: main text (light gray)

[colors.cursor]
text = "#C9C7CD"   # ca: blue lavender (cursor)
cursor = "#92A2D5" # na: main text (light gray)

[colors.selection]
background = "#3B4252" # gr: dark gray (selection background)
text = "#C9C7CD"       # na: main text (light gray)

[colors.bright]
black = "#4C566A"   # nb: medium gray (bright black)
red = "#EA83A5"     # ia: intense pink (bright red)
green = "#90B99F"   # va: soft green (bright green)
yellow = "#E6B99D"  # ca: beige (bright yellow)
blue = "#85B5BA"    # va: light blue-green (bright blue)
magenta = "#92A2D5" # ca: blue lavender (bright magenta)
cyan = "#85B5BA"    # va: light blue-green (bright cyan)
white = "#C9C7CD"   # na: main text (bright white)

[[colors.indexed_colors]]
index = 16
color = "#F5A191" # ca: light peach (orange)

[[colors.indexed_colors]]
index = 17
color = "#E29ECA" # ia: soft pink (pink)terminal]

[selection]
#semantic_escape_chars = ",│‘|:"' ()[]{}<>t"
# save_to_clipboard     = true

[cursor.style]
shape = "Beam"
blinking = "Always"

[cursor.vi_mode_style]
shape = "Block"
blinking = "Off"

[cursor]
blink_interval = 500
blink_timeout = 0

[font]
size = 13
# style = "bold"

[font.normal]
family = "IosevkaTerm NF"

[window]
# decorations = "None"
# startup_mode = "Windowed"
# dynamic_padding = true
option_as_alt = "Both"
opacity = 0.85
# blur = true

# [window.padding]
# x = 2
# y = 0

[mouse]
hide_when_typing = true
bindings = [
  { mouse = "Middle", action = "PasteSelection" },
]

[env]
TERM = "xterm-256color"
